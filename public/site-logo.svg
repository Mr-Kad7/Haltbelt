<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Haltbet</title>
  <desc id="desc">Haltbet brand logo with black background and red accent lines.</desc>
  <defs>
    <linearGradient id="redGlow" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4c4c"/>
      <stop offset="35%" stop-color="#ff1d27"/>
      <stop offset="70%" stop-color="#e30014"/>
      <stop offset="100%" stop-color="#b40000"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#050505"/>

  <path d="M-120 610 C300 230, 680 150, 1030 160 C1310 170, 1540 260, 1710 420" stroke="url(#redGlow)" stroke-width="28" stroke-linecap="round" fill="none" filter="url(#softGlow)" opacity="0.95"/>
  <path d="M-80 730 C250 790, 520 770, 760 680 C1020 580, 1300 600, 1670 820" stroke="url(#redGlow)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.95"/>

  <text x="100" y="430" font-family="Arial, Helvetica, sans-serif" font-size="290" font-weight="900" letter-spacing="-12" fill="#f3f3f3">Halt</text>
  <text x="610" y="430" font-family="Arial, Helvetica, sans-serif" font-size="290" font-weight="900" letter-spacing="-12" fill="url(#redGlow)">bet</text>

  <path d="M556 464 C680 492, 760 490, 890 445 C980 412, 1075 420, 1172 452" stroke="url(#redGlow)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.94"/>

  <g fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="6" text-transform="uppercase">
    <text x="430" y="540" font-size="30" fill="#efefef" opacity="0.9">WE BUILD NEW BEGINNINGS.</text>
    <text x="470" y="585" font-size="38" fill="#ef2029" font-weight="900">NO JUDGEMENT.</text>
  </g>

  <g fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="3">
    <text x="540" y="670" fill="#f1f1f1">SUPPORT</text>
    <text x="720" y="670" fill="#f1f1f1">EDUCATE</text>
    <text x="920" y="670" fill="#f1f1f1">EMPOWER</text>
    <line x1="690" y1="645" x2="690" y2="690" stroke="#f5f5f5" opacity="0.8"/>
    <line x1="900" y1="645" x2="900" y2="690" stroke="#f5f5f5" opacity="0.8"/>
  </g>
</svg>
